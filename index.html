<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메타 광고 리포트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --bg: #f3f6fc; --card: #ffffff; --ink: #14213d; --muted: #66728a; --line: #e2e8f4; --soft: #f5f8ff;
    --accent: #2563eb; --accent-2: #3b82f6; --accent-soft: #e8f0ff; --up: #0f9d6a; --down: #e0473c;
    --bar: #9cc0fb; --lineclr: #1d4ed8; --gold: #f2a516;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Noto Sans KR", system-ui, sans-serif; font-size: 14px; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px; }
  .hero { background: linear-gradient(120deg, #1d4ed8 0%, #2563eb 45%, #4f8ff7 100%); color: #fff; }
  .hero-in { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 14px; padding: 26px 16px 64px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.02em; }
  .sub { color: rgba(255,255,255,.8); font-size: 12px; margin-top: 6px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: rgba(255,255,255,.85); }
  select, input[type=date], button { font: inherit; font-size: 13px; padding: 7px 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; }
  .hero select, .hero input, .hero button { border-color: transparent; }
  button { cursor: pointer; }
  .hero #csv, .hero #htmlReport { background: rgba(255,255,255,.16); color: #fff; border: 1px solid rgba(255,255,255,.45); }
  .hero #htmlReport:disabled { opacity: .6; cursor: wait; }
  .panel { background: var(--card); border-radius: 16px; box-shadow: 0 6px 24px rgba(37,99,235,.08); margin-top: -44px; position: relative; }
  .acc-tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 14px 16px 0; }
  .tab { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-size: 13px; font-weight: 500; color: var(--muted); }
  .tab:hover { border-color: var(--accent-2); color: var(--accent); }
  .tab.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .sec-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 8px; padding: 10px 16px 0; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--card); z-index: 5; border-radius: 0 0 0 0; }
  .sec-tabs { display: flex; gap: 2px; overflow-x: auto; }
  .sec { border: none; background: none; border-radius: 0; padding: 10px 14px 12px; font-size: 14px; font-weight: 500; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
  .sec:hover { color: var(--accent); }
  .sec.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
  .grp { display: inline-flex; background: var(--soft); border-radius: 10px; padding: 3px; margin-bottom: 8px; }
  .grp button { border: none; background: none; padding: 6px 14px; border-radius: 8px; font-size: 13px; color: var(--muted); }
  .grp button.on { background: var(--card); color: var(--accent); font-weight: 700; box-shadow: 0 1px 4px rgba(20,33,61,.12); }
  #content { padding: 20px 16px 24px; min-height: 420px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
  @media (max-width: 860px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
  .kpi { background: var(--soft); border-radius: 12px; padding: 14px 16px; border-top: 3px solid var(--accent-2); }
  .kpi .label { color: var(--muted); font-size: 12px; }
  .kpi .val { font-size: 21px; font-weight: 700; margin-top: 4px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .kpi .delta { font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card h2 small { font-weight: 400; color: var(--muted); font-size: 12px; }
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 960px) { .duo { grid-template-columns: 1fr; } }
  .duo .kpis { grid-template-columns: repeat(2, 1fr); margin: 0; }
  .gtitle { font-size: 16px; font-weight: 700; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .gtitle .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .gtitle .share { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 999px; }
  .chart-box { position: relative; height: 260px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; cursor: pointer; user-select: none; background: var(--soft); }
  th:first-child, td:first-child { text-align: left; white-space: normal; min-width: 130px; }
  tbody tr:hover td, tr:hover td { background: #fafcff; }
  tr.total td { font-weight: 700; border-top: 2px solid var(--accent); background: var(--accent-soft); }
  .bar { height: 4px; background: var(--accent-2); border-radius: 2px; margin-top: 4px; opacity: .7; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; margin-left: 6px; background: var(--accent-soft); color: var(--accent); vertical-align: 1px; }
  .warn { background: #fff7e6; border: 1px solid #ffd99a; color: #8a5a00; border-radius: 10px; padding: 10px 12px; font-size: 12px; line-height: 1.6; margin-bottom: 14px; }
  .note { color: var(--muted); font-size: 12px; line-height: 1.6; }
  .foot { padding: 16px 4px 40px; }
  .empty { text-align: center; color: var(--muted); padding: 28px 0; }
  .seg { display: inline-flex; background: var(--soft); border-radius: 10px; padding: 3px; }
  .seg button { border: none; background: none; border-radius: 8px; padding: 6px 12px; color: var(--muted); }
  .seg button.on { background: var(--accent); color: #fff; font-weight: 700; }
  .cr-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .cr-list h3 { font-size: 14px; margin: 18px 0 10px; color: var(--ink); font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .cr-list h3::before { content: ""; width: 4px; height: 14px; background: var(--accent); border-radius: 2px; }
  .cr-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  @media (max-width: 960px) { .cr-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 560px) { .cr-grid { grid-template-columns: repeat(2, 1fr); } }
  .cr { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--card); position: relative; transition: box-shadow .15s; }
  .cr:hover { box-shadow: 0 6px 18px rgba(37,99,235,.14); }
  .cr .thumb { aspect-ratio: 1 / 1; background: var(--soft); display: block; width: 100%; object-fit: cover; }
  .cr .nothumb { aspect-ratio: 1 / 1; background: var(--soft); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; }
  .cr .rank { position: absolute; top: 8px; left: 8px; background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
  .cr .rank.r1 { background: var(--gold); }
  .cr .body { padding: 9px 10px 11px; }
  .cr .name { font-size: 12px; line-height: 1.4; height: 34px; overflow: hidden; word-break: break-all; }
  .cr .main { font-size: 16px; font-weight: 700; margin-top: 6px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .cr .meta { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.5; font-variant-numeric: tabular-nums; }
  .lock { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; background: linear-gradient(120deg, #1d4ed8 0%, #2563eb 45%, #4f8ff7 100%); }
  .lock[hidden] { display: none; }
  .lock form { background: var(--card); border-radius: 16px; padding: 28px 24px; width: 100%; max-width: 340px; box-shadow: 0 12px 40px rgba(20,33,61,.25); }
  .lock h2 { font-size: 18px; margin: 0 0 6px; }
  .lock p { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
  .lock input { width: 100%; font: inherit; font-size: 15px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
  .lock button { width: 100%; margin-top: 10px; padding: 10px; background: var(--accent); color: #fff; border: none; font-weight: 700; }
  .lock button:disabled { opacity: .6; cursor: wait; }
  .lock .err { color: var(--down); font-size: 12px; min-height: 18px; margin-top: 8px; }
  /* 담당자 코멘트 (대시보드 바로 아래) */
  .cmt { background: var(--card); border-radius: 16px; box-shadow: 0 6px 24px rgba(37,99,235,.08); margin-top: 16px; padding: 18px 20px; }
  .cmt h2 { font-size: 15px; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .cmt h2 small { font-weight: 400; color: var(--muted); font-size: 12px; }
  .cmt-item { border-left: 3px solid var(--accent); background: var(--soft); border-radius: 0 10px 10px 0; padding: 12px 14px; margin-bottom: 10px; }
  .cmt-item .when { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .cmt-item .when b { color: var(--accent); font-weight: 700; }
  .cmt-item .txt { white-space: pre-wrap; line-height: 1.7; font-size: 14px; word-break: break-word; }
  .cmt-empty { color: var(--muted); font-size: 13px; padding: 6px 0 2px; }
  .cmt-edit { margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 14px; }
  .cmt-edit textarea { width: 100%; min-height: 130px; font: inherit; font-size: 14px; line-height: 1.6; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; resize: vertical; }
  .cmt-edit .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
  .cmt-edit .primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; }
  .cmt-edit .msg { font-size: 12px; color: var(--muted); line-height: 1.6; }
  .cmt-edit .msg a { color: var(--accent); }
</style>
</head>
<body>
<div class="lock" id="lock">
  <form id="lockForm" autocomplete="off">
    <h2><span id="lockClient"></span>메타 광고 리포트</h2>
    <p>비밀번호를 입력하세요.</p>
    <input type="password" id="pw" inputmode="numeric" autofocus aria-label="비밀번호">
    <button type="submit" id="pwBtn">확인</button>
    <div class="err" id="pwErr"></div>
  </form>
</div>
<div class="hero">
  <div class="wrap hero-in">
    <div>
      <h1><span id="client"></span>메타 광고 리포트</h1>
      <div class="sub" id="updated">데이터 불러오는 중…</div>
    </div>
    <div class="controls">
      <select id="preset">
        <option value="yesterday">어제</option>
        <option value="last7" selected>최근 7일</option>
        <option value="lastweek">지난주 (월~일)</option>
        <option value="thismonth">이번 달</option>
        <option value="lastmonth">지난달</option>
        <option value="thisyear">올해 (1/1~어제)</option>
        <option value="custom">직접 선택</option>
      </select>
      <input type="date" id="since"> <span>~</span> <input type="date" id="until">
      <button id="csv">CSV 다운로드</button>
      <button id="htmlReport">HTML 보고서</button>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="panel">
    <nav class="acc-tabs" id="tabs"></nav>
    <div class="sec-bar">
      <div class="sec-tabs" id="sections"></div>
      <div id="groupbar"></div>
    </div>
    <div id="content"></div>
  </div>
  <section class="cmt" id="comments" aria-label="담당자 코멘트"></section>
  <p class="note foot">
    협력광고 계정<span class="badge">협력</span>의 구매·장바구니·전환값은 광고관리자의 <b>공유 항목 포함</b> 기준이고, 자사몰 계정은 픽셀 기준 일반 구매 지표입니다.
    증감은 선택 기간과 같은 길이의 직전 기간과 비교합니다. 행사명은 캠페인명에서 읽어옵니다.
    소재는 같은 이미지·영상을 쓴 광고끼리 합산하며, ROAS 순위는 최소 지출 조건을 넘는 소재만 포함합니다.
  </p>
</div>

<script>
const fmtW = n => "₩" + Math.round(n || 0).toLocaleString("ko-KR");
const fmtN = n => Math.round(n || 0).toLocaleString("ko-KR");
const fmtP = n => ((n || 0) * 100).toFixed(2) + "%";
const fmtR = n => ((n || 0) * 100).toFixed(0) + "%";
const fmtS = n => ((n || 0) * 100).toFixed(1) + "%";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const iso = d => d.toISOString().slice(0, 10);
const addDays = (s, n) => { const d = new Date(s + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000) + 1;
const unpack = d => d.columns ? d.rows.map(v => Object.fromEntries(d.columns.map((c, i) => [c, v[i]]))) : d.rows;

let DATA = null, ADS = [], CRE = {}, ACC = {}, ACCOUNT = "all", chart = null;
const SORT = {}, CRTYPE = {};
let MIN_SPEND = 50000;

/* ---------- 기간 ---------- */
function kstToday() { return iso(new Date(Date.now() + 9 * 3600 * 1000)); }
function presetRange(p) {
  const t = kstToday(), y = addDays(t, -1), first = t.slice(0, 8) + "01";
  if (p === "yesterday") return [y, y];
  if (p === "last7") return [addDays(t, -7), y];
  if (p === "lastweek") { const dow = (new Date(t + "T00:00:00Z").getUTCDay() + 6) % 7, mon = addDays(t, -dow); return [addDays(mon, -7), addDays(mon, -1)]; }
  if (p === "thismonth") return [first, y < first ? first : y];
  if (p === "lastmonth") { const end = addDays(first, -1); return [end.slice(0, 8) + "01", end]; }
  if (p === "thisyear") return [t.slice(0, 4) + "-01-01", y];
  return null;
}
function range() {
  const since = document.getElementById("since").value, until = document.getElementById("until").value;
  const len = daysBetween(since, until);
  return { since, until, pSince: addDays(since, -len), pUntil: addDays(since, -1) };
}

/* ---------- 캠페인명 해석 ---------- */
function parseName(name, acc) {
  let n = String(name || "");
  const pre = acc && acc.name_prefix;
  if (pre && n.includes(pre)) n = n.slice(n.indexOf(pre) + pre.length);
  const tokens = n.split("_").map(s => s.trim()).filter(Boolean);
  const event = (tokens[0] || "기타").replace(/\s*\(.*\)\s*$/, "");
  const k = /키즈/.test(n), g = /일반/.test(n);
  return { event, seg: k && g ? "일반&키즈" : k ? "키즈" : g ? "일반" : "기타" };
}
function groupOf(campaignName, acc) {
  if (!acc || !acc.groups) return null;
  const hit = acc.groups.find(g => g.match && String(campaignName).includes(g.match));
  return (hit || acc.groups.find(g => !g.match) || acc.groups[acc.groups.length - 1]).name;
}

/* ---------- 집계 ---------- */
function sum(rows) {
  const s = { spend: 0, impressions: 0, reach: 0, clicks: 0, link_clicks: 0, add_to_cart: 0, purchases: 0, purchase_value: 0, video_views: 0 };
  for (const r of rows) for (const k in s) s[k] += +r[k] || 0;
  s.ctr = s.impressions ? s.link_clicks / s.impressions : 0;
  s.cpc = s.link_clicks ? s.spend / s.link_clicks : 0;
  s.cpa = s.purchases ? s.spend / s.purchases : 0;
  s.cpm = s.impressions ? s.spend / s.impressions * 1000 : 0;
  s.atc_rate = s.link_clicks ? s.add_to_cart / s.link_clicks : 0;
  s.cvr = s.link_clicks ? s.purchases / s.link_clicks : 0;
  s.roas = s.spend ? s.purchase_value / s.spend : 0;
  s.hook = s.impressions ? s.video_views / s.impressions : 0;
  return s;
}
function inScope(r, accId, group) {
  if (accId !== "all" && r.account_id !== accId) return false;
  if (group && groupOf(r.campaign_name, ACC[r.account_id]) !== group) return false;
  return true;
}
const between = (r, a, b) => r.date >= a && r.date <= b;

function delta(cur, prev, inverse) {
  if (!prev) return '<span class="flat">–</span>';
  const d = (cur - prev) / prev;
  if (Math.abs(d) < 0.0005) return '<span class="flat">0.0%</span>';
  const good = inverse ? d < 0 : d > 0;
  return `<span class="${good ? "up" : "down"}">${d > 0 ? "▲" : "▼"} ${Math.abs(d * 100).toFixed(1)}%</span>`;
}

/* ---------- 화면 조각 ---------- */
function kpiHtml(c, p) {
  return [
    ["지출", fmtW(c.spend), delta(c.spend, p.spend)],
    ["노출", fmtN(c.impressions), delta(c.impressions, p.impressions)],
    ["링크 클릭", fmtN(c.link_clicks), delta(c.link_clicks, p.link_clicks)],
    ["CTR (링크)", fmtP(c.ctr), delta(c.ctr, p.ctr)],
    ["CPC (링크)", fmtW(c.cpc), delta(c.cpc, p.cpc, true)],
    ["구매", fmtN(c.purchases), delta(c.purchases, p.purchases)],
    ["구매전환값", fmtW(c.purchase_value), delta(c.purchase_value, p.purchase_value)],
    ["ROAS", fmtR(c.roas), delta(c.roas, p.roas)],
  ].map(([l, v, d]) => `<div class="kpi"><div class="label">${l}</div><div class="val">${v}</div><div class="delta">${d}</div></div>`).join("");
}

// 묶음별 성과 표 (행사명별, 일반/키즈별, 캠페인별, 계정별 공용)
const BREAK_COLS = [
  ["spend", "지출", fmtW], ["share", "비중", fmtS], ["impressions", "노출", fmtN], ["link_clicks", "링크클릭", fmtN],
  ["ctr", "CTR", fmtP], ["purchases", "구매", fmtN], ["cpa", "CPA", fmtW], ["purchase_value", "구매전환값", fmtW], ["roas", "ROAS", fmtR],
];
function breakdownTable(id, cur, prev, keyFn, opts = {}) {
  const groups = {}, pgroups = {};
  for (const r of cur) { const k = keyFn(r); (groups[k] ||= []).push(r); }
  for (const r of prev) { const k = keyFn(r); (pgroups[k] ||= []).push(r); }
  const total = sum(cur), ptotal = sum(prev);
  let list = Object.entries(groups).map(([k, rows]) => {
    const s = sum(rows);
    return { key: k, ...s, share: total.spend ? s.spend / total.spend : 0, proas: sum(pgroups[k] || []).roas, sub: opts.subFn ? opts.subFn(rows[0]) : "", label: opts.labelFn ? opts.labelFn(rows[0]) : k };
  }).filter(x => x.spend > 0);
  const st = SORT[id] || { key: "spend", dir: -1 };
  if (st.key === "_order" && opts.order) list.sort((a, b) => opts.order.indexOf(a.key) - opts.order.indexOf(b.key));
  else list.sort((a, b) => st.dir * ((a[st.key] || 0) - (b[st.key] || 0)));
  const more = opts.limit && list.length > opts.limit ? list.length - opts.limit : 0;
  if (more) list = list.slice(0, opts.limit);
  const head = `<tr><th>${opts.label}</th>${BREAK_COLS.map(([k, l]) => `<th data-t="${id}" data-k="${k}">${l}${st.key === k ? (st.dir < 0 ? " ↓" : " ↑") : ""}</th>`).join("")}<th>ROAS 증감</th></tr>`;
  if (!list.length) return `<table>${head}<tr><td colspan="11" class="empty">선택한 기간에 지출이 없습니다</td></tr></table>`;
  const body = list.map(x => `<tr><td>${esc(x.label)}${x.sub}${opts.bar ? `<div class="bar" style="width:${Math.max(2, x.share * 100)}%"></div>` : ""}</td>${BREAK_COLS.map(([k, , f]) => `<td>${f(x[k])}</td>`).join("")}<td>${delta(x.roas, x.proas)}</td></tr>`).join("");
  const tot = opts.total ? `<tr class="total"><td>합계</td>${BREAK_COLS.map(([k, , f]) => `<td>${k === "share" ? "100%" : f(total[k])}</td>`).join("")}<td>${delta(total.roas, ptotal.roas)}</td></tr>` : "";
  const moreRow = more ? `<tr><td colspan="11" class="note" style="text-align:center">그 외 ${more}개는 생략 · 정렬을 바꾸거나 검색해서 확인하세요</td></tr>` : "";
  return `<table>${head}${body}${moreRow}${tot}</table>`;
}

// 소재 성과 (이미지/영상/카탈로그 x ROAS TOP5 / 전환매출 TOP5)
function creativeBlock(id, accId, group, since, until) {
  const rows = ADS.filter(r => between(r, since, until) && inScope(r, accId, group));
  const by = {};
  for (const r of rows) {
    const c = CRE[r.ad_id] || { type: "기타", key: "a_" + r.ad_id, thumb: "" };
    const k = c.key;
    const o = (by[k] ||= { type: c.type, thumb: c.thumb, rows: [], names: {} });
    o.rows.push(r);
    o.names[r.ad_name] = (o.names[r.ad_name] || 0) + (+r.spend || 0);
    if (!o.thumb && c.thumb) o.thumb = c.thumb;
  }
  const items = Object.values(by).map(o => ({ ...o, ...sum(o.rows), name: Object.entries(o.names).sort((a, b) => b[1] - a[1])[0][0], ads: Object.keys(o.names).length })).filter(x => x.spend > 0);
  const types = ["이미지", "영상", "카탈로그"].filter(t => items.some(x => x.type === t));
  if (!types.length) return `<div class="empty">선택한 기간에 소재 데이터가 없습니다</div>`;
  const cur = types.includes(CRTYPE[id]) ? CRTYPE[id] : types[0];
  const pool = items.filter(x => x.type === cur);
  const byRoas = pool.filter(x => x.spend >= MIN_SPEND).sort((a, b) => b.roas - a.roas).slice(0, 5);
  const byRev = [...pool].sort((a, b) => b.purchase_value - a.purchase_value).slice(0, 5);
  const card = (x, i, mainLabel, mainVal) => `
    <div class="cr">
      <div class="rank${i === 0 ? " r1" : ""}">${i + 1}</div>
      ${x.thumb ? `<a data-enc="${esc(x.thumb)}" target="_blank" rel="noopener"><img class="thumb" data-enc="${esc(x.thumb)}" alt=""></a>` : `<div class="nothumb">이미지 없음</div>`}
      <div class="body">
        <div class="name" title="${esc(x.name)}">${esc(x.name)}</div>
        <div class="main">${mainLabel} ${mainVal}</div>
        <div class="meta">지출 ${fmtW(x.spend)} · 구매 ${fmtN(x.purchases)}<br>${mainLabel === "ROAS" ? "매출 " + fmtW(x.purchase_value) : "ROAS " + fmtR(x.roas)} · CTR ${fmtP(x.ctr)}${x.type === "영상" ? `<br>3초 재생률 ${fmtP(x.hook)}` : ""}${x.ads > 1 ? `<br>광고 ${x.ads}개 합산` : ""}</div>
      </div>
    </div>`;
  const grid = (list, label, f, key) => list.length ? `<div class="cr-grid">${list.map((x, i) => card(x, i, label, f(x[key]))).join("")}</div>` : `<div class="empty">조건에 맞는 소재가 없습니다</div>`;
  return `
    <div class="cr-head">
      <div class="seg">${types.map(t => `<button data-cr="${id}" data-type="${t}" class="${t === cur ? "on" : ""}">${t} ${items.filter(x => x.type === t).length}</button>`).join("")}</div>
      <label class="note">ROAS 순위 최소 지출
        <select class="minspend">${[0, 50000, 100000, 300000, 500000].map(v => `<option value="${v}"${v === MIN_SPEND ? " selected" : ""}>${v ? fmtW(v) : "제한 없음"}</option>`).join("")}</select>
      </label>
    </div>
    <div class="cr-list">
      <h3>ROAS TOP 5</h3>${grid(byRoas, "ROAS", fmtR, "roas")}
      <h3>전환매출 TOP 5</h3>${grid(byRev, "매출", fmtW, "purchase_value")}
    </div>`;
}

    html += `<div class="card"><h2>전환 추이 <small>지출 vs 구매전환값</small></h2><div class="chart-box"><canvas id="trend"></canvas></div></div>`;
    html += `<div class="card"><h2>유입 추이 <small>일별 ${TRAFFIC_VIEWS[TRAFFIC].bar[1]} · ${TRAFFIC_VIEWS[TRAFFIC].line[1]}</small></h2>
      <div class="cr-head" style="margin-bottom:12px"><div class="seg">${Object.entries(TRAFFIC_VIEWS).map(([k, v]) => `<button data-traffic="${k}" class="${k === TRAFFIC ? "on" : ""}">${v.label}</button>`).join("")}</div></div>
      <div class="chart-box"><canvas id="traffic"></canvas></div></div>`;
    if (!acc) {
      html += `<div class="card"><h2>계정별 성과 ${cmp}</h2><div class="table-wrap">${breakdownTable("acc", cur, prev, r => ACC[r.account_id]?.name || r.account_id, { label: "계정", total: true, bar: true })}</div></div>`;
    } else if (groups) {
      const total = sum(cur).spend;
      html += `<div class="duo">${groups.map(gn => {
        const c = cur.filter(r => inScope(r, ACCOUNT, gn)), p = prev.filter(r => inScope(r, ACCOUNT, gn)), s = sum(c);
        return `<div class="card"><div class="gtitle"><span class="dot"></span>${esc(gn)}<span class="share">지출 비중 ${fmtS(total ? s.spend / total : 0)}</span></div><div class="kpis">${kpiHtml(s, sum(p))}</div></div>`;
      }).join("")}</div>`;
    }
  } else if (SECTION === "event") {
    html += `<div class="card"><h2>행사명별 성과 <small>${esc(scopeName)} · 비교 ${pSince} ~ ${pUntil}</small></h2><div class="table-wrap">${breakdownTable("ev_" + ACCOUNT + g, cur, prev, evKey, { label: "행사명", bar: true, total: true })}</div></div>`;
  } else if (SECTION === "audience") {
    html += audienceSection(acc, g, since, until, pSince, pUntil, scopeName);
  } else if (SECTION === "creative") {
    html += `<div class="card"><h2>소재 성과 <small>${esc(scopeName)} · 이미지·영상별 TOP 5</small></h2>${creativeBlock("cr_" + ACCOUNT + g, ACCOUNT, g, since, until)}</div>`;
  } else if (SECTION === "products") {
    html += productSection(acc, g, since, until, pSince, pUntil, scopeName);
  } else if (SECTION === "adset") {
    const camps = {};
    for (const r of cur) if (+r.spend > 0) camps[r.campaign_id] = (camps[r.campaign_id] || 0) + (+r.spend);
    const campList = Object.keys(camps).sort((a, b) => camps[b] - camps[a]);
    const nameOf = id => (cur.find(r => r.campaign_id === id) || {}).campaign_name || id;
    const selCamp = campList.includes(ADSET_CAMP[ACCOUNT]) ? ADSET_CAMP[ACCOUNT] : "";
    const c2 = selCamp ? cur.filter(r => r.campaign_id === selCamp) : cur;
    const p2 = selCamp ? prev.filter(r => r.campaign_id === selCamp) : prev;
    html += `<div class="card"><h2>광고세트별 성과 <small>${esc(scopeName)} · 열 제목을 누르면 정렬</small></h2>
      <div class="cr-head" style="margin-bottom:12px"><label class="note">캠페인
        <select id="adsetCamp" style="max-width:min(560px, 80vw)"><option value="">전체 캠페인 (${campList.length}개)</option>${campList.map(id => `<option value="${esc(id)}"${id === selCamp ? " selected" : ""}>${esc(nameOf(id))}</option>`).join("")}</select>
      </label></div>
      <div class="table-wrap">${breakdownTable("adset_" + ACCOUNT + g, c2, p2, r => r.adset_id, {
        label: "광고세트", total: true, bar: true,
        labelFn: r => r.adset_name || r.adset_id,
        subFn: r => { const p = parseName(r.campaign_name, accOf(r)); return `<div class="note">${acc ? "" : esc(accOf(r)?.name) + " · "}${esc(r.campaign_name)}<br>${esc(p.event)}</div>`; },
      })}</div></div>`;
  } else if (SECTION === "campaign") {
    html += `<div class="card"><h2>캠페인별 성과 <small>${esc(scopeName)} · 열 제목을 누르면 정렬</small></h2><div class="table-wrap">${breakdownTable("camp_" + ACCOUNT + g, cur, prev, r => r.campaign_name, {
      label: "캠페인", total: true,
      subFn: r => { const p = parseName(r.campaign_name, accOf(r)); return `<div class="note">${acc ? "" : esc(accOf(r)?.name) + (r.account_type === "collab" ? '<span class="badge">협력</span>' : "") + " · "}${esc(p.event)}</div>`; },
    })}</div></div>`;
  }

  const box = document.getElementById("content");
  box.innerHTML = html;
  if (SECTION === "summary") { drawTrend(cur, since, until); drawTraffic(cur, since, until); }
  if (SECTION === "audience") drawAudChart();
  if (SECTION === "products") drawProdChart();
  const ps = document.getElementById("psearch");
  if (ps) {
    let t;
    ps.oninput = () => { clearTimeout(t); t = setTimeout(() => { PSEARCH = ps.value; render(); const n = document.getElementById("psearch"); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 250); };
  }
  const pl = document.getElementById("plimit");
  if (pl) pl.onchange = () => { PLIMIT = +pl.value; render(); };

  box.querySelectorAll("th[data-t]").forEach(th => th.onclick = () => {
    const t = th.dataset.t, k = th.dataset.k, s = SORT[t] || { key: "spend", dir: -1 };
    SORT[t] = { key: k, dir: s.key === k ? -s.dir : -1 }; render();
  });
  box.querySelectorAll("button[data-cr]").forEach(b => b.onclick = () => { CRTYPE[b.dataset.cr] = b.dataset.type; render(); });
  box.querySelectorAll("button[data-aud]").forEach(b => b.onclick = () => { AUD = b.dataset.aud; render(); });
  box.querySelectorAll("button[data-traffic]").forEach(b => b.onclick = () => { TRAFFIC = b.dataset.traffic; render(); });
  const ac = document.getElementById("adsetCamp");
  if (ac) ac.onchange = () => { ADSET_CAMP[ACCOUNT] = ac.value; render(); };
  box.querySelectorAll(".minspend").forEach(s => s.onchange = () => { MIN_SPEND = +s.value; render(); });
  hydrateThumbs(box);
  renderComments();
}

/* ---------- HTML 보고서 내보내기 ----------
   지금 선택한 기간·계정 기준으로 데이터와 소재 썸네일을 담은 HTML 파일 하나를 만든다 (AD-Dashboard 보고서와 같은 방식).
   받은 파일은 비밀번호 없이 열리므로 광고주에게 그대로 보낼 수 있다 */
async function exportHtmlReport() {
  const btn = document.getElementById("htmlReport");
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = "생성 중…";
  try {
    const { since, until, pSince, pUntil } = range();
    const client = (document.getElementById("client").textContent || "").trim() || "광고주";
    const scope = ACCOUNT === "all" ? "전체 계정" : (ACC[ACCOUNT]?.name || ACCOUNT);
    const inRange = (r, a, b) => between(r, a, b) && inScope(r, ACCOUNT, null);
    const cur = DATA.rows.filter(r => inRange(r, since, until));
    const prev = DATA.rows.filter(r => inRange(r, pSince, pUntil));
    const c = sum(cur), p = sum(prev);

    // 묶음별 표: 지출 많은 순
    const groupRows = (rows, prows, keyFn, labelFn, limit) => {
      const g = {}, pg = {};
      for (const r of rows) (g[keyFn(r)] ||= []).push(r);
      for (const r of prows) (pg[keyFn(r)] ||= []).push(r);
      const list = Object.entries(g).map(([k, rs]) => ({ label: labelFn ? labelFn(rs[0]) : k, ...sum(rs), proas: sum(pg[k] || []).roas }))
        .filter(x => x.spend > 0).sort((a, b) => b.spend - a.spend);
      return limit ? list.slice(0, limit) : list;
    };
    const campaigns = groupRows(cur, prev, r => r.campaign_name);
    const events = groupRows(cur, prev, r => parseName(r.campaign_name, ACC[r.account_id]).event);
    const adsets = groupRows(cur, prev, r => r.adset_id, r => r.adset_name || r.adset_id, 20);

    // 일별 추이
    const daily = [];
    for (let d = since; d <= until; d = addDays(d, 1)) daily.push({ date: d, ...sum(cur.filter(r => r.date === d)) });

    // 소재: 같은 이미지·영상끼리 합산, 지출 많은 순 12개, 썸네일은 data URI 로 파일 안에 넣음
    const by = {};
    for (const r of ADS.filter(r => inRange(r, since, until))) {
      const cr = CRE[r.ad_id] || { type: "기타", key: "a_" + r.ad_id, thumb: "" };
      const o = (by[cr.key] ||= { type: cr.type, thumb: cr.thumb, rows: [], names: {} });
      o.rows.push(r); o.names[r.ad_name] = (o.names[r.ad_name] || 0) + (+r.spend || 0);
      if (!o.thumb && cr.thumb) o.thumb = cr.thumb;
    }
    const toDataUrl = async path => {
      if (!path) return "";
      const u = await thumbUrl(path);
      if (!u) return "";
      const blob = await (await fetch(u)).blob();
      return await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => res(""); fr.readAsDataURL(blob); });
    };
    const creatives = Object.values(by).map(o => ({ ...o, ...sum(o.rows), name: Object.entries(o.names).sort((a, b) => b[1] - a[1])[0][0], ads: Object.keys(o.names).length }))
      .filter(x => x.spend > 0).sort((a, b) => b.spend - a.spend).slice(0, 12);
    for (const x of creatives) x.img = await toDataUrl(x.thumb);

    // 연령·성별·노출위치
    const aud = {};
    for (const [k, file] of [["age", "age"], ["gender", "gender"], ["placement", "placement"]]) {
      const d = await getJson(`data/bd_${file}.json`);
      const rows = d ? unpack(d).filter(r => inRange(r, since, until)) : [];
      const def = AUD_DIMS[k];
      let list = groupRows(rows, [], def.key);
      if (def.order) list.sort((a, b) => def.order.indexOf(a.label) - def.order.indexOf(b.label));
      aud[k] = list;
    }

    const comments = COMMENTS.entries
      .filter(e => (e.account === ACCOUNT || e.account === "all") && e.since <= until && e.until >= since)
      .sort((a, b) => b.since.localeCompare(a.since));

    const html = buildReportHtml({ client, scope, since, until, pSince, pUntil, c, p, campaigns, events, adsets, daily, creatives, aud, comments,
      generated: new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 16).replace("T", " ") + " KST" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([html], { type: "text/html;charset=utf-8" }));
    a.download = `${client.replace(/\s+/g, "_")}_메타광고운영보고서_${since}~${until}.html`;
    document.body.appendChild(a); a.click(); a.remove();
  } catch (e) {
    console.error("[html report]", e);
    document.getElementById("updated").textContent = "보고서를 만들지 못했습니다. 새로고침 후 다시 시도해 주세요.";
  } finally {
    btn.disabled = false; btn.textContent = label;
  }
}

function buildReportHtml(R) {
  const pct = (a, b) => b ? (a - b) / b : null;
  const dl = (a, b, inverse) => {
    const d = pct(a, b);
    if (d === null) return `<span class="flat">–</span>`;
    if (Math.abs(d) < 0.0005) return `<span class="flat">0.0%</span>`;
    const good = inverse ? d < 0 : d > 0;
    return `<span class="${good ? "up" : "down"}">${d > 0 ? "▲" : "▼"} ${Math.abs(d * 100).toFixed(1)}%</span>`;
  };
  const kpis = [
    ["지출", fmtW(R.c.spend), dl(R.c.spend, R.p.spend)], ["노출", fmtN(R.c.impressions), dl(R.c.impressions, R.p.impressions)],
    ["링크 클릭", fmtN(R.c.link_clicks), dl(R.c.link_clicks, R.p.link_clicks)], ["CTR (링크)", fmtP(R.c.ctr), dl(R.c.ctr, R.p.ctr)],
    ["CPC (링크)", fmtW(R.c.cpc), dl(R.c.cpc, R.p.cpc, true)], ["구매", fmtN(R.c.purchases), dl(R.c.purchases, R.p.purchases)],
    ["구매전환값", fmtW(R.c.purchase_value), dl(R.c.purchase_value, R.p.purchase_value)], ["ROAS", fmtR(R.c.roas), dl(R.c.roas, R.p.roas)],
  ].map(([l, v, d]) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="d">${d}</div></div>`).join("");
  const total = R.c.spend || 1;
  const table = (list, head, withDelta = true) => list.length ? `<div class="tw"><table><thead><tr><th>${head}</th><th>지출</th><th>비중</th><th>노출</th><th>링크클릭</th><th>CTR</th><th>구매</th><th>CPA</th><th>구매전환값</th><th>ROAS</th>${withDelta ? "<th>ROAS 증감</th>" : ""}</tr></thead><tbody>${
    list.map(x => `<tr><td>${esc(x.label)}</td><td>${fmtW(x.spend)}</td><td>${fmtS(x.spend / total)}</td><td>${fmtN(x.impressions)}</td><td>${fmtN(x.link_clicks)}</td><td>${fmtP(x.ctr)}</td><td>${fmtN(x.purchases)}</td><td>${fmtW(x.cpa)}</td><td>${fmtW(x.purchase_value)}</td><td>${fmtR(x.roas)}</td>${withDelta ? `<td>${dl(x.roas, x.proas)}</td>` : ""}</tr>`).join("")
  }</tbody></table></div>` : `<p class="empty">선택한 기간에 데이터가 없습니다.</p>`;
  const audTable = (list, head) => list.length ? `<div class="tw"><table><thead><tr><th>${head}</th><th>지출</th><th>비중</th><th>노출</th><th>링크클릭</th><th>CTR</th><th>구매</th><th>ROAS</th></tr></thead><tbody>${
    list.map(x => `<tr><td>${esc(x.label)}</td><td>${fmtW(x.spend)}</td><td>${fmtS(x.spend / (list.reduce((t, y) => t + y.spend, 0) || 1))}</td><td>${fmtN(x.impressions)}</td><td>${fmtN(x.link_clicks)}</td><td>${fmtP(x.ctr)}</td><td>${fmtN(x.purchases)}</td><td>${fmtR(x.roas)}</td></tr>`).join("")
  }</tbody></table></div>` : `<p class="empty">데이터가 없습니다.</p>`;
  const cards = R.creatives.length ? `<div class="cr">${R.creatives.map((x, i) => `<div class="cc"><div class="rk">${i + 1}</div>${x.img ? `<img src="${x.img}" alt="">` : `<div class="noimg">이미지 없음</div>`}<div class="cb"><div class="cn">${esc(x.name)}</div><div class="ct">${esc(x.type)}${x.ads > 1 ? ` · 광고 ${x.ads}개 합산` : ""}</div><div class="cm">지출 <b>${fmtW(x.spend)}</b><br>ROAS <b>${fmtR(x.roas)}</b> · 구매 ${fmtN(x.purchases)}<br>CTR ${fmtP(x.ctr)}</div></div></div>`).join("")}</div>` : `<p class="empty">선택한 기간에 소재 데이터가 없습니다.</p>`;
  const cmts = R.comments.length ? R.comments.map(e => `<div class="cmt"><div class="cw">${e.since} ~ ${e.until}${e.updated_at ? ` · ${esc(e.updated_at)} 작성` : ""}</div><div class="cx">${esc(e.text)}</div></div>`).join("") : `<p class="empty">이 기간에 등록된 코멘트가 없습니다.</p>`;
  const chartData = JSON.stringify({ labels: R.daily.map(d => d.date.slice(5)), spend: R.daily.map(d => Math.round(d.spend)), value: R.daily.map(d => Math.round(d.purchase_value)) }).replace(/</g, "\\u003c");
  return `<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>${esc(R.client)} 메타 광고 운영 보고서 (${R.since} ~ ${R.until})</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"><\/script>
<style>
  :root { --bg: #f3f6fc; --card: #fff; --ink: #14213d; --muted: #66728a; --line: #e2e8f4; --soft: #f5f8ff; --accent: #2563eb; --up: #0f9d6a; --down: #e0473c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Noto Sans KR", system-ui, sans-serif; font-size: 14px; }
  .hero { background: linear-gradient(120deg, #1d4ed8 0%, #2563eb 45%, #4f8ff7 100%); color: #fff; padding: 28px 16px 26px; }
  .w { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
  .hero h1 { margin: 0; font-size: 24px; letter-spacing: -0.02em; }
  .hero .meta { margin-top: 8px; font-size: 13px; color: rgba(255,255,255,.88); line-height: 1.7; }
  section { background: var(--card); border-radius: 14px; box-shadow: 0 4px 18px rgba(37,99,235,.07); padding: 18px; margin-top: 16px; }
  h2 { font-size: 16px; margin: 0 0 12px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: baseline; }
  h2 small { font-weight: 400; color: var(--muted); font-size: 12px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (max-width: 760px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
  .kpi { background: var(--soft); border-radius: 10px; padding: 12px 14px; border-top: 3px solid #3b82f6; }
  .kpi .l { color: var(--muted); font-size: 12px; } .kpi .v { font-size: 20px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; } .kpi .d { font-size: 12px; margin-top: 2px; }

  .chart { position: relative; height: 260px; }
  .tw { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; font-size: 13px; }
  th { background: var(--soft); color: var(--muted); font-weight: 500; font-size: 12px; }
  th:first-child, td:first-child { text-align: left; white-space: normal; min-width: 140px; }
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; } @media (max-width: 900px) { .duo { grid-template-columns: 1fr; } }

  .cc { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; position: relative; }
  .cc img, .cc .noimg { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; background: var(--soft); }

  .cc .rk { position: absolute; top: 8px; left: 8px; background: var(--accent); color: #fff; width: 24px; height: 24px; border-radius: 50%; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .cb { padding: 10px; } .cn { font-size: 12px; font-weight: 700; word-break: break-all; } .ct { font-size: 11px; color: var(--muted); margin: 2px 0 6px; } .cm { font-size: 12px; line-height: 1.6; } .cm b { color: var(--accent); }

</style></head><body>
<div class="hero"><div class="w"><h1>${esc(R.client)} 메타 광고 운영 보고서</h1>
<div class="meta">분석 기간 <b>${R.since} ~ ${R.until}</b> · 비교 기간 ${R.pSince} ~ ${R.pUntil} · ${esc(R.scope)}<br>작성 ${R.generated}</div></div></div>
<div class="w">
  <section><h2>핵심 성과 <small>비교 기간 대비 증감</small></h2><div class="kpis">${kpis}</div></section>
  <section><h2>담당자 코멘트</h2>${cmts}</section>
  <section><h2>일별 추이 <small>지출 vs 구매전환값</small></h2><div class="chart"><canvas id="trend"></canvas></div></section>
  <section><h2>캠페인별 성과</h2>${table(R.campaigns, "캠페인")}</section>
  <section><h2>행사명별 성과</h2>${table(R.events, "행사명")}</section>

  <section><h2>광고세트별 성과 <small>지출 상위 20개</small></h2>${table(R.adsets, "광고세트")}</section>

/* ---------- 담당자 코멘트 ----------
   data/comments.json(.enc) 에 { entries: [{ since, until, account, text, updated_at }] } 로 저장.
   보는 사람: 선택한 기간과 겹치는 코멘트를 계정별로 보여줌
   쓰는 사람: 주소 끝에 #edit 를 붙여 열면 작성칸이 나오고, 저장 파일을 받아 저장소 data 폴더에 올림 */
let COMMENTS = { entries: [] };
let CMT_KEY = null;
const EDIT_MODE = location.hash === "#edit";
const UPLOAD_URL = "https://github.com/Linkprice-code/holidays-meta-report/upload/main/data";
const cmtScopeName = id => id === "all" ? "전체" : (ACC[id]?.name || id);

function renderComments() {
  const box = document.getElementById("comments");
  if (!box || !DATA) return;
  const { since, until } = range();
  const list = COMMENTS.entries
    .filter(e => (e.account === ACCOUNT || e.account === "all") && e.since <= until && e.until >= since)
    .sort((a, b) => b.since.localeCompare(a.since) || (a.account === "all") - (b.account === "all"));
  const items = list.map(e => `<div class="cmt-item"><div class="when"><b>${e.since} ~ ${e.until}</b> · ${esc(cmtScopeName(e.account))}${e.updated_at ? ` · ${esc(e.updated_at)} 작성` : ""}</div><div class="txt">${esc(e.text)}</div></div>`).join("");
  const head = `<h2>담당자 코멘트 <small>${since} ~ ${until} · ${esc(cmtScopeName(ACCOUNT))}</small></h2>`;
  const body = items || `<div class="cmt-empty">선택한 기간에 등록된 코멘트가 없습니다.</div>`;

  // 작성칸은 기간·계정이 바뀔 때만 새로 그려서, 탭을 눌러도 쓰던 내용이 지워지지 않게 함
  const key = `${since}|${until}|${ACCOUNT}`;
  if (!EDIT_MODE) { box.innerHTML = head + body; return; }
  if (CMT_KEY === key && box.querySelector(".cmt-edit")) { box.querySelector(".cmt-list").innerHTML = body; return; }
  CMT_KEY = key;
  const mine = COMMENTS.entries.find(e => e.since === since && e.until === until && e.account === ACCOUNT);
  box.innerHTML = `${head}<div class="cmt-list">${body}</div>
    <div class="cmt-edit">
      <label class="note" for="cmtText">이 기간(${since} ~ ${until}) · ${esc(cmtScopeName(ACCOUNT))} 코멘트 작성</label>
      <textarea id="cmtText" placeholder="예) 10월 4주차: 넾다세일 소재 신규 투입 후 CTR 상승, 다음 주 예산 증액 검토">${esc(mine ? mine.text : "")}</textarea>
      <div class="row">
        <button class="primary" id="cmtSave">이 기간 코멘트 저장</button>
        <button id="cmtDel"${mine ? "" : " disabled"}>이 기간 코멘트 삭제</button>
        <button id="cmtFile">코멘트 저장 파일 받기</button>
      </div>
      <p class="msg" id="cmtMsg">저장한 내용은 아직 이 화면에만 반영됩니다. 모두에게 보이게 하려면 <b>코멘트 저장 파일 받기</b>로 받은 <code>comments.json.enc</code>를
        <a href="${UPLOAD_URL}" target="_blank" rel="noopener">저장소 data 폴더</a>에 올리세요. 1~2분 뒤 링크에 반영됩니다.</p>
    </div>`;
  const msg = t => { document.getElementById("cmtMsg").innerHTML = t; };
  document.getElementById("cmtSave").onclick = () => {
    const text = document.getElementById("cmtText").value.trim();
    if (!text) { msg("코멘트 내용을 입력하세요."); return; }
    COMMENTS.entries = COMMENTS.entries.filter(e => !(e.since === since && e.until === until && e.account === ACCOUNT));
    COMMENTS.entries.push({ since, until, account: ACCOUNT, text, updated_at: kstToday() });
    CMT_KEY = null; renderComments();
    msg(`저장했습니다. 이제 <b>코멘트 저장 파일 받기</b>를 눌러 파일을 <a href="${UPLOAD_URL}" target="_blank" rel="noopener">저장소 data 폴더</a>에 올리세요.`);
  };
  document.getElementById("cmtDel").onclick = () => {
    COMMENTS.entries = COMMENTS.entries.filter(e => !(e.since === since && e.until === until && e.account === ACCOUNT));
    CMT_KEY = null; renderComments();
    msg("이 기간 코멘트를 지웠습니다. 저장 파일을 다시 받아 올려야 모두에게 반영됩니다.");
  };
  document.getElementById("cmtFile").onclick = async () => {
    const plain = new TextEncoder().encode(JSON.stringify(COMMENTS));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, AES_KEY, plain));
    const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([out], { type: "application/octet-stream" }));
    a.download = "comments.json.enc";
    a.click();
    msg(`<code>comments.json.enc</code> 를 받았습니다. <a href="${UPLOAD_URL}" target="_blank" rel="noopener">저장소 data 폴더 업로드 화면</a>에 끌어다 놓고 <b>Commit changes</b>를 누르세요. 같은 이름의 기존 파일은 자동으로 바뀝니다.`);
  };
}

  const el = document.getElementById("traffic");
  if (!el || typeof Chart === "undefined") return;
  const v = TRAFFIC_VIEWS[TRAFFIC];
  const dates = []; for (let d = since; d <= until; d = addDays(d, 1)) dates.push(d);

      ],
    },
    options: {
      maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
      plugins: { legend: { labels: { color: col("--muted") } },
        tooltip: { callbacks: { label: x => x.dataset.yAxisID === "y" ? `${bl}: ${bf(x.raw)}` : `${ll}: ${lf(x.raw / lmul)}` } } },
      scales: {
        x: { ticks: { color: col("--muted"), maxTicksLimit: 16 }, grid: { display: false } },
        y: { position: "left", ticks: { color: col("--muted"), callback: short }, grid: { color: col("--line") } },
        y1: { position: "right", ticks: { color: col("--muted"), callback: n => lsuf ? n.toFixed(1) + lsuf : (lf === fmtW ? "₩" : "") + short(n) }, grid: { display: false } },
      },
    },
  });
}

  chart = new Chart(document.getElementById("trend"), {
    data: {
      labels: dates.map(d => d.slice(5)),

        { type: "line", label: "구매전환값", data: rv, borderColor: col("--lineclr"), backgroundColor: col("--lineclr"), yAxisID: "y1", order: 1, borderWidth: 2.5, tension: 0.3, pointRadius: dates.length > 60 ? 0 : 2 },
      ],
    },
    options: {
      maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
      plugins: { legend: { labels: { color: col("--muted") } }, tooltip: { callbacks: { label: x => `${x.dataset.label}: ${fmtW(x.raw)}` } } },
      scales: {
        x: { ticks: { color: col("--muted"), maxTicksLimit: 16 }, grid: { display: false } },
        y: { position: "left", ticks: { color: col("--muted"), callback: v => (v / 10000).toLocaleString() + "만" }, grid: { color: col("--line") } },
        y1: { position: "right", ticks: { color: col("--muted"), callback: v => (v / 10000).toLocaleString() + "만" }, grid: { display: false } },
      },
    },
  });
}

function downloadCsv() {
  const { since, until } = range();
  const g = SECTION !== "summary" ? (GROUP[ACCOUNT] ?? null) : null;
  if (SECTION === "products" && PROD && PROD.rows) {
    const cols = ["date", "account_name", "campaign_name", "product_id", "product_name", "spend", "impressions", "link_clicks", "add_to_cart", "purchases", "purchase_value"];
    const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const lines = PROD.rows.filter(r => between(r, since, until) && inScope(r, ACCOUNT, g))
      .map(r => cols.map(c => q({ ...r, account_name: ACC[r.account_id]?.name || r.account_id, product_name: pname(r.pkey) }[c])).join(","));
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["\ufeff" + [cols.join(","), ...lines].join("\n")], { type: "text/csv" }));
    a.download = `meta_products_${since}_${until}.csv`;
    a.click();
    return;
  }
  const rows = DATA.rows.filter(r => between(r, since, until) && inScope(r, ACCOUNT, g));
  const cols = ["date", "account_name", "account_type", "campaign_name", "event", "group", "adset_name", "spend", "impressions", "reach", "clicks", "link_clicks", "view_content", "add_to_cart", "purchases", "purchase_value"];
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = rows.map(r => {
    const acc = ACC[r.account_id], p = parseName(r.campaign_name, acc);
    const x = { ...r, event: p.event, segment: p.seg, group: groupOf(r.campaign_name, acc) || "" };
    return cols.map(c => q(x[c])).join(",");
  });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + [cols.join(","), ...lines].join("\n")], { type: "text/csv" }));
  a.download = `meta_${since}_${until}.csv`;
  a.click();
}

function applyPreset() {
  const r = presetRange(document.getElementById("preset").value);
  if (r) { document.getElementById("since").value = r[0]; document.getElementById("until").value = r[1]; }
  render();
}

/* ---------- 비밀번호 / 복호화 ----------
   data/ 는 scripts/crypt.mjs 가 AES-256-GCM 으로 암호화한 .enc 파일만 올라가 있다.
   키 = PBKDF2-SHA256(비밀번호, key.json 의 salt) 64바이트 중 앞 32바이트 */
const PW_STORE = "metaReportPw";
const CHECK_TEXT = "meta-report-ok";
let AES_KEY = null;
const fetchRaw = p => fetch(p + "?t=" + Date.now()).then(r => r.ok ? r : null).catch(() => null);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function deriveKey(pw, info) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64(info.salt), iterations: info.iter }, base, 512);
  // 코멘트 저장 파일을 만들 때 같은 키로 암호화하므로 encrypt 도 허용
  return crypto.subtle.importKey("raw", bits.slice(0, 32), "AES-GCM", false, ["decrypt", "encrypt"]);
}
const decryptBuf = (key, buf) => crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, key, buf.slice(12));

const getJson = async p => {
  // accounts.json 은 설정 파일이라 암호화하지 않는다
  if (!p.startsWith("data/")) { const r = await fetchRaw(p); return r ? r.json().catch(() => null) : null; }
  const r = await fetchRaw(p + ".enc");
  if (!r) return null;
  try { return JSON.parse(new TextDecoder().decode(await decryptBuf(AES_KEY, await r.arrayBuffer()))); } catch { return null; }
};

// 소재 썸네일도 암호화되어 있어 풀어서 blob 주소로 붙인다 (한 번 푼 이미지는 재사용)
const THUMB_URL = {};
function thumbUrl(p) {
  return THUMB_URL[p] ||= fetchRaw(p + ".enc")
    .then(r => r ? r.arrayBuffer() : Promise.reject())
    .then(buf => decryptBuf(AES_KEY, buf))
    .then(plain => URL.createObjectURL(new Blob([plain], { type: "image/jpeg" })))
    .catch(() => "");
}
function hydrateThumbs(box) {
  box.querySelectorAll("[data-enc]").forEach(el => thumbUrl(el.dataset.enc).then(u => {
    if (!u) return;
    if (el.tagName === "IMG") el.src = u; else el.href = u;
  }));
}

async function unlock(pw) {
  const r = await fetchRaw("data/key.json");
  if (!r) throw new Error("nodata");
  const info = await r.json();
  const key = await deriveKey(pw, info);
  try {
    const plain = new TextDecoder().decode(await decryptBuf(key, b64(info.check)));
    if (plain !== CHECK_TEXT) throw 0;
  } catch { throw new Error("wrong"); }
  AES_KEY = key;
}

function askPassword() {
  const form = document.getElementById("lockForm"), input = document.getElementById("pw"),
        btn = document.getElementById("pwBtn"), err = document.getElementById("pwErr");
  const tryPw = async (pw, remembered) => {
    btn.disabled = true; err.textContent = remembered ? "" : "확인 중…";
    try {
      await unlock(pw);
      try { sessionStorage.setItem(PW_STORE, pw); } catch {}
      document.getElementById("lock").hidden = true;
      start();
    } catch (e) {
      try { sessionStorage.removeItem(PW_STORE); } catch {}
      err.textContent = remembered ? "" : e.message === "nodata"
        ? "데이터가 아직 없습니다. Actions 에서 수집을 먼저 실행하세요." : "비밀번호가 틀렸습니다.";
      input.select();
    }
    btn.disabled = false;
  };
  form.onsubmit = e => { e.preventDefault(); if (input.value) tryPw(input.value, false); };
  // 같은 탭에서 새로고침하면 다시 묻지 않음 (탭을 닫으면 사라짐)
  let saved = null;
  try { saved = sessionStorage.getItem(PW_STORE); } catch {}
  if (saved) tryPw(saved, true);
  getJson("accounts.json").then(cfg => {
    const c = ((cfg && cfg.client) || "").trim();
    if (c) { document.getElementById("lockClient").textContent = c + " "; document.title = c + " 메타 광고 리포트"; }
  });
}

function start() {
Promise.all([getJson("data/daily.json"), getJson("data/ads.json"), getJson("data/creatives.json"), getJson("data/comments.json")]).then(([d, ads, cre, cmt]) => {
  if (!d) throw new Error("no data");
  DATA = { ...d, rows: unpack(d) };
  ADS = ads ? unpack(ads) : [];
  CRE = cre || {};
  COMMENTS = cmt && Array.isArray(cmt.entries) ? cmt : { entries: [] };
  // 계정 설정은 저장소의 accounts.json 을 우선 (파싱 규칙·그룹을 바꾸면 바로 반영)
  return getJson("accounts.json").then(cfg => {
    const accounts = (cfg && cfg.accounts) || d.accounts;
    accounts.forEach(a => ACC[a.id] = a);
    // 업체명은 accounts.json 의 client 한 곳에서만 바꾼다
    const client = ((cfg && cfg.client) || "").trim();
    if (client) { document.getElementById("client").textContent = client + " "; document.title = client + " 메타 광고 리포트"; }
    document.getElementById("updated").textContent = `마지막 갱신: ${d.updated_at} · 계정 ${accounts.length}개`;
    const tabs = [{ id: "all", name: "전체" }, ...accounts];
    const box = document.getElementById("tabs");
    box.innerHTML = tabs.map(a => `<button class="tab${a.id === "all" ? " on" : ""}" data-id="${a.id}">${esc(a.name)}</button>`).join("");
    box.querySelectorAll(".tab").forEach(b => b.onclick = () => {
      ACCOUNT = b.dataset.id; box.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === b)); render();
    });
    document.getElementById("preset").onchange = applyPreset;
    ["since", "until"].forEach(id => document.getElementById(id).onchange = () => { document.getElementById("preset").value = "custom"; render(); });
    document.getElementById("csv").onclick = downloadCsv;
    document.getElementById("htmlReport").onclick = exportHtmlReport;
    applyPreset();
  });
}).catch(() => {
  document.getElementById("updated").textContent = "data/daily.json 을 찾을 수 없습니다. Actions 에서 수집을 먼저 실행하세요.";
});
}

askPassword();
